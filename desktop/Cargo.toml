[package]
name = "dron-reparto-desktop"
version = "1.0.0"
edition = "2021"
description = "Simulación 3D del corredor UTS→UIS en Bevy (cliente nativo autónomo)"

[dependencies]
bevy = { version = "0.16", features = ["bevy_gltf", "jpeg", "png"] }
bevy_egui = "0.35"
egui = "0.31"
earcut = "0.4.12"
parry3d-f64 = "0.17"
winit = "0.30"


serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
